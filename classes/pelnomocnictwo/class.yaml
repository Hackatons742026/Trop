id: pelnomocnictwo
label: Pełnomocnictwo
detect:
  threshold: 5.0
  margin: 2.0
  keywords:
    # Letter-spaced title "P E Ł N O M O C N I C T W O".
    - { pattern: "(?i)\\bP\\s*E\\s*[ŁL]\\s*N\\s*O\\s*M\\s*O\\s*C\\s*N\\s*I\\s*C\\s*T\\s*W\\s*O\\b", weight: 5.0 }
    - { pattern: "(?i)\\bpełnomocnictwo\\b", weight: 5.0 }
    - { pattern: "(?i)udziela\\s+(?:niniejszym\\s+)?pełnomocnictwa", weight: 4.0 }
    - { pattern: "(?i)ustanawiam\\s+pełnomocnikiem", weight: 4.0 }
    - { pattern: "(?i)\\bmocodawc", weight: 3.0 }
    - { pattern: "(?i)\\bpełnomocnik", weight: 2.0 }
    - { pattern: "(?i)do\\s+reprezentowania", weight: 2.0 }
    - { pattern: "(?i)przed\\s+Krajową\\s+Izbą\\s+Odwoławczą", weight: 2.0 }
    - { pattern: "(?i)udzielania\\s+dalszych\\s+pełnomocnictw", weight: 2.0 }

blocks:
  - id: mocodawca
    # "upoważniam" (the grant), not "upoważni…" which also hits the adjective
    # in "osoba upoważniona do reprezentacji <firma> (KRS …)".
    # Keep the block open through the signature section so consortium
    # "W imieniu <firma>:" lines stay inside mocodawca.
    start: "^[ \\t]*P[ \\t]*E[ \\t]*Ł[ \\t]*N[ \\t]*O[ \\t]*M[ \\t]*O[ \\t]*C[ \\t]*N[ \\t]*I[ \\t]*C[ \\t]*T[ \\t]*W[ \\t]*O|(?i:mocodawc|udzielając[ya]|ja,?\\s+niżej|spółka|Wykonawcy\\s+wspólnie)"
    end: "(?i)(Pełnomocnictwo\\s+przyjmuję|§\\s*3|pe\\w*mocnictwo\\s+obejmuje)"
  # Attorneys are listed between the grant ("Pełnomocnik/Pełnomocnicy",
  # "upoważniam", "udzielam pełnomocnictwa", "ustanawiam") and the scope /
  # next section. Never end at "PESEL": it belongs to the attorney entry.
  - id: pelnomocnicy
    # pehnomocnictwa / pelnomocnictwa: common OCR damage to „pełnomocnictwa”.
    start: "(?i)(pełnomocni(?:k|cy)|upoważniam|udziel\\w*\\s+pe\\w*mocnictwa|ustanawiam)"
    end: "(?i)(do\\s+reprezentowania|§\\s*3|pe\\w*mocnictwo\\s+obejmuje|zakres\\s+umocowania|podpis|\\bdata\\b|Każdy\\s+z\\s+pełnomocników)"
  - id: podpisujacy
    start: "(?i)(w\\s+imieniu|reprezentowan|podpis)"
    end: null

fields: []

lists:
  - path: mocodawca
    block: mocodawca
    # Consortium PoAs list members as "1) Firm…; 2) Firm…" or sign as
    # "W imieniu Firm:". Single-grant PoAs fall back to one item from the block.
    mode: multi_from_regex
    # Own-line signature header only — not "Działając w imieniu X (dalej: …)".
    item_pattern: "(?im)^\\s*W\\s+imieniu\\s+([^:\\n]{3,120})\\s*:\\s*$"
    fields:
      - key: data.krs
        extractors:
          - type: regex
            pattern: "(?i)\\bKRS\\b\\s*[:\\-]?\\s*(\\d{6,10})"
            group: 1
            normalize: [krs_pad10]
      - key: data.nip
        extractors:
          - type: regex
            pattern: "(?i)\\bNIP\\b\\s*[:\\-]?\\s*([\\d\\-\\s]{10,16})"
            group: 1
            normalize: [digits_only]
      - key: data.nazwa
        extractors:
          - type: regex
            # "Mocodawcą jest Belmoria Rozwiązania S.A., ul. …" / "(dalej: …)"
            pattern: "(?i)mocodawc\\w*\\s+jest\\s+([^,(\\n]*[A-Za-zĄĆĘŁŃÓŚŹŻ][^,(\\n]{2,120})"
            group: 1
            normalize: [collapse_ws, strip_titles]
          - type: regex
            pattern: "(?i)działając\\s+w\\s+imieniu\\s+([^,(\\n]*[A-Za-zĄĆĘŁŃÓŚŹŻ][^,(\\n]{2,120})"
            group: 1
            normalize: [collapse_ws, strip_titles]
          - type: regex
            pattern: "(?i)w\\s+imieniu\\s+([^,:(\\n]*[A-Za-zĄĆĘŁŃÓŚŹŻ][^,:(\\n]{2,120})\\s*:"
            group: 1
            normalize: [collapse_ws, strip_titles]
          - type: regex
            # Sole trader: "pod firmą DUDEK-TECH Jarosław Dudek, ul. …"
            pattern: "(?i)pod\\s+firmą\\s+([^,(\\n]{3,120})"
            group: 1
            normalize: [collapse_ws, strip_titles]
          # Case-sensitive: uppercase firm name with a legal-form suffix.
          - type: regex
            pattern: "([A-ZĄĆĘŁŃÓŚŹŻ][^\\n]{2,100}?(?i:S\\.A\\.|sp\\.\\s*z\\s*o\\.o\\.(?:\\s*sp\\.\\s*k\\.)?|sp\\.\\s*k\\.|sp\\.\\s*j\\.|spółka\\s+akcyjna))"
            group: 1
            normalize: [collapse_ws]
          - type: regex
            # "Mocodawca:" heading must not capture the dotted signature line.
            pattern: "(?i)(?:mocodawca|spółka|firma)\\s*[:\\-]?\\s*([A-Za-zĄĆĘŁŃÓŚŹŻ][^,(\\n]{2,120})"
            group: 1
            normalize: [collapse_ws, strip_titles]
      - key: data.imie_nazwisko
        extractors:
          - type: regex
            pattern: "(?i:osoba\\s+fizyczna)[^\\n]{0,40}?([A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 1
            normalize: [collapse_ws, nominative]
          - type: regex
            # "Ja, niżej podpisany Jarosław Dudek, prowadzący działalność…"
            pattern: "(?i:ja,?\\s+niżej\\s+podpisany)\\s+([A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 1
            normalize: [collapse_ws, nominative]
      # Natural-person cues first (a sole trader also has a NIP / firm name),
      # then legal-person cues. No fallback: unknown stays null, never invented.
      - key: data.typ
        extractors:
          - type: regex
            pattern: "(?i)(osoba\\s+fizyczna|prowadząc\\w*\\s+działalność\\s+gospodarczą|Centraln\\w*\\s+Ewidencj\\w*\\s+i\\s+Informacj\\w*|\\bCEIDG\\b)"
            group: 0
            const_on_match: "osoba_fizyczna"
          - type: regex
            pattern: "(?i)(\\bKRS\\b|S\\.A\\.|sp\\.\\s*z\\s*o\\.\\s*o\\.|sp\\.\\s*[kj]\\.|\\bspółk)"
            group: 0
            const_on_match: "osoba_prawna"
      # Signatures sit after the mocodawca section, so this field uses its own
      # block. Name follows a dotted signature line (optionally then a
      # "Za <firma>" line) or a "w imieniu …:" cue;
      # titled names (attorneys accepting the mandate) are not signatories.
      - key: podpisujacy
        extractors:
          - type: regex_all
            block: podpisujacy
            pattern: "(?:\\.{5,}[ \\t]*\\n(?:[ \\t]*(?i:za)[ \\t][^\\n]*\\n)?[ \\t]*|(?i:podpisując[ya]|w\\s+imieniu[^:\\n]{0,40}:|reprezentowan[ya]\\s+przez)\\s*)([A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)[ \\t]+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 1
            normalize: [collapse_ws, strip_titles, nominative]
            wrap_key: imie_nazwisko

  - path: pelnomocnicy
    block: pelnomocnicy
    mode: multi_from_regex
    # Name tokens: Title-case or ALL-CAPS; a global (?i) would turn any two
    # words ("udziela pełnomocnictwa") into an attorney. The professional
    # title is required: every attorney in the training gold carries one, and
    # without it company names / court names / signatories became attorneys.
    # 1) title before name  2) "Name (adwokat|radca…"  3) bare Title-case line
    # 4) "ADW.\\nNAME\\nSURNAME" OCR split
    item_pattern: "((?i:\\b(?:adw\\.?|adwokat|r\\.?\\s*pr\\.?|radca\\s+prawny)\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))|[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\\s*\\(\\s*(?i:adwokat|radca\\s+prawny)|(?i:adw\\.?|ADW\\.?)\\s*\\n\\s*[A-ZĄĆĘŁŃÓŚŹŻ]{2,}\\s*\\n\\s*[A-ZĄĆĘŁŃÓŚŹŻ]{2,}|(?:^|\\n)\\s*([A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?\\s+[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+(?:-[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?)\\s*(?=\\n|$))"
    fields:
      - key: imie_nazwisko
        extractors:
          - type: regex
            pattern: "(?i:^(?:adw\\.?|adwokat|r\\.?\\s*pr\\.?|radca\\s+prawny)\\s+)?([A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 1
            normalize: [person_name, nominative]
          - type: regex
            # OCR: ADW. / NAME / SURNAME on separate lines
            pattern: "(?i:adw\\.?|ADW\\.?)\\s*\\n\\s*([A-ZĄĆĘŁŃÓŚŹŻ]{2,})\\s*\\n\\s*([A-ZĄĆĘŁŃÓŚŹŻ]{2,})"
            group: 0
            normalize: [person_name, nominative]
      - key: pesel
        extractors:
          - type: regex
            pattern: "(?i)\\bPESEL\\b\\s*[:\\-]?\\s*(\\d{11})"
            group: 1
            normalize: [digits_only]
          - type: const
            value: null
