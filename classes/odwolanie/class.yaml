id: odwolanie
label: Odwołanie do KIO
detect:
  threshold: 7.0
  margin: 1.5
  keywords:
    # Letter-spaced title "O D W O Ł A N I E" counts as a filing heading.
    - { pattern: "(?i)\\bO\\s*D\\s*W\\s*O\\s*[ŁL]\\s*A\\s*N\\s*I\\s*E\\b", weight: 5.0 }
    - { pattern: "(?i)\\bodwołanie\\b", weight: 4.0 }
    - { pattern: "(?i)Prezes\\s+Krajowej\\s+Izby\\s+Odwoławczej", weight: 5.0 }
    - { pattern: "(?i)Krajow[ae]\\s+Izb[ay]\\s+Odwoławcz", weight: 4.0 }
    - { pattern: "(?i)\\bKIO\\b", weight: 1.5 }
    - { pattern: "(?i)\\bodwołując", weight: 3.0 }
    - { pattern: "(?i)\\bzamawiając", weight: 1.5 }
    - { pattern: "(?i)\\bzarzut", weight: 2.0 }
    - { pattern: "(?i)zaskarżon", weight: 2.0 }
    - { pattern: "(?i)wnoszę\\s+odwołanie|wnosi\\s+odwołanie", weight: 3.5 }
    - { pattern: "(?i)wnoszę\\s+o\\s*:|Działając\\s+w\\s+imieniu", weight: 2.0 }
    - { pattern: "(?i)art\\.\\s*513|Prawo\\s+zamówień\\s+publicznych", weight: 1.5 }

blocks:
  - id: header
    start: null
    end: "(?i)odwo[łl]uj"
  - id: odwolujacy
    # Party label on its own line. OCR often drops diacritics (Odwołujacy).
    # Require trailing : or end-ish so prose "Odwołujący wskazuje" does not match.
    # slice_blocks already passes re.MULTILINE.
    start: "^\\s*Odwo[łl]uj[aą]c\\w*\\s*:"
    end: "(?i)^\\s*(?:Zamawiaj[aą]c\\w*\\s*:|Dotyczy\\b|ODWO[ŁL]ANIE\\b|Zarzut|Wykonawca\\s+wybrany)"
  - id: zamawiajacy
    # Stop before Odwołujący when Zamawiający is printed first (common layout).
    start: "^\\s*Zamawiaj[aą]c\\w*\\s*:"
    end: "(?i)^\\s*(?:Odwo[łl]uj[aą]c\\w*\\s*:|Dotyczy\\b|ODWO[ŁL]ANIE\\b|Zarzut|Wykonawca\\s+wybrany)|(?i:dotycząc[ae]\\s+postępowania|zamówieni[ae]\\s+publiczn|przedmiot|zarzut)"
  - id: zarzuty
    start: "(?i)zarzut"
    end: null

fields:
  - path: OdwolanieKIO.data
    extractors:
      # "Bydgoszcz, dnia 2 marca 2026 roku" or "Zielona Góra, 7 marca 2026 roku"
      # or "Kraków, 02.07.2026". Never "ustawy z dnia 11 września 2019".
      - type: regex
        pattern: "(?i)(?:^|\\n)\\s*[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40}\\s*,\\s*dnia\\s+(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        pattern: "(?:^|\\n)\\s*[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40}\\s*,\\s*(\\d{1,2}\\s+(?i:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)\\s+\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        pattern: "(?:^|\\n)\\s*[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40}\\s*,\\s*(\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]

  - path: OdwolanieKIO.miejscowosc
    extractors:
      # Case-sensitive on purpose: [A-Z…] must mean an uppercase initial, so
      # only keywords are wrapped in a scoped (?i:…) flag.
      - type: regex
        pattern: "(?:^|\\n)\\s*([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40})\\s*,\\s*(?i:dnia)\\s+"
        group: 1
        normalize: [collapse_ws, strip_titles]
      - type: regex
        pattern: "(?:^|\\n)\\s*([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40})\\s*,\\s*\\d{1,2}\\s+(?i:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)\\s+"
        group: 1
        normalize: [collapse_ws, strip_titles]
      - type: regex
        pattern: "(?:^|\\n)\\s*([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40})\\s*,\\s*\\d{1,2}[./-]\\d{1,2}[./-]\\d{4}"
        group: 1
        normalize: [collapse_ws, strip_titles]

  - path: OdwolanieKIO.czynnosc_dzien
    extractors:
      # Prefer "w dniu …" next to the challenged act (not "ustawy z dnia 11 września 2019").
      - type: regex
        pattern: "(?i)w\\s+dniu\\s+(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        pattern: "(?i)(?:unieważni\\w*|odrzuci\\w*|wykluczy\\w*|udostępni\\w*)[^\\n]{0,40}?(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        block: zarzuty
        pattern: "(?i)(?:z\\s+dnia|dnia)\\s+(\\d{1,2}[./-]\\d{1,2}[./-]\\d{4}|\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4})"
        group: 1
        normalize: [date_pl]

  - path: OdwolanieKIO.czynnosc_powod_id
    extractors:
      # Hold-out style: "polegających na: 1) wyborze … 2) zaniechaniu …"
      - type: regex
        # Challenged-act list only — not the later "zaskarżonym … 1) art. …" zarzuty list.
        pattern: "(?i)polegających\\s+na[\\s\\S]{0,80}?\\d[\\.\\)]\\s*([^\\n]{8,220})"
        group: 1
        normalize: [collapse_ws]
        map_to_powod_id: true
      - type: regex
        pattern: "(?i)(?:odwołanie\\s+wobec|wnoszę\\s+odwołanie\\s+wobec)[\\s\\S]{0,320}?\\d[\\.\\)]\\s*([^\\n]{8,220})"
        group: 1
        normalize: [collapse_ws]
        map_to_powod_id: true
      # Intro sentence before the zarzuty list carries the challenged act.
      - type: regex
        # One sentence only — do not swallow the following zarzut list
        # ("zaniechania wezwania…") or the powod map prefers the wrong id.
        pattern: "(?i)((?:Zamawiający|w\\s+dniu)[^\\n]{0,180}?(?:unieważni\\w*|odrzuc\\w*|wyklucz\\w*|wybra\\w*|udostępni\\w*|zaniecha\\w*|modyfikacj\\w*|zmodyfikowa\\w*|dokona\\w*\\s+modyfikacji|opublikowa\\w*|przekaza\\w*|poinformowa\\w*|wezwa\\w*|ogłosi\\w*)[^\\n]{5,120})"
        group: 1
        normalize: [collapse_ws]
        map_to_powod_id: true
      - type: regex
        block: zarzuty
        pattern: "(?i)(zaniechani[ue]\\s+unieważnienia|zaniechani[ue]\\s+wykluczenia|zaniechani[ue]\\s+odrzucenia|decyzj[aei]\\s+o\\s+unieważnieniu\\s+postępowania|unieważni\\w*\\s+postępowani|odpowiedzi/?wyjaśnienia\\s+do\\s+SWZ|wyjaśnieni[ae]\\s+do\\s+SWZ|modyfikacj[aei]\\s+treści\\s+(?:SWZ|Specyfikacji)|publikacj[aei]\\s+specyfikacji\\s+warunków\\s+zamówienia|specyfikacj[aei]\\s+warunków\\s+zamówienia\\s*\\(?SWZ\\)?|projektowane\\s+postanowienia\\s+umowy|ogłoszeni[ae]\\s+wyboru\\s+oferty|wyborze?\\s+(?:jako\\s+)?najkorzystniejszej|decyzj[aei]\\s+o\\s+wykluczeniu\\s+wykonawcy|decyzj[aei]\\s+o\\s+odrzuceniu\\s+oferty|odrzuc\\w*\\s+ofert|wyklucz\\w*\\s+(?:wykonawc|Odwołującego|z\\s+postępowania)|opis\\s+przedmiotu\\s+zamówienia)"
        group: 1
        normalize: [collapse_ws]
        map_to_powod_id: true

  - path: OdwolanieKIO.czynnosc_opis
    extractors:
      - type: derived
        from: OdwolanieKIO.czynnosc_powod_id
        via: czynnosc_powod_opis

  - path: ZamowieniePubliczne.numer_bzp
    extractors:
      - type: regex
        pattern: "(?i)(?:BZP|Biuletyn(?:ie)?\\s+Zamówień\\s+Publicznych)[^\\d]{0,40}(\\d{4}\\s*/\\s*BZP\\s*\\d{5,12}(?:\\s*/\\s*\\d{1,3})?)"
        group: 1
        normalize: [bzp_number]
      # Skip historical notices: "…BZP…), które zostało unieważnione".
      - type: regex
        pattern: "(\\d{4}/BZP\\s*\\d{5,12}(?:/\\d{1,3})?)(?![^\\n]{0,60}unieważn)"
        group: 1
        normalize: [bzp_number]

  - path: ZamowieniePubliczne.numer_ted
    extractors:
      # Labels / DUUE. ted_number drops non-2026 years (historical 2025/S noise).
      - type: regex
        pattern: "(?i)(?:numer\\s+ogłoszenia\\s+)?TED\\s*[:\\-]?\\s*(\\d{4}\\s*/\\s*S\\s*\\d{1,4}\\s*-\\s*\\d{5,7}|\\d{5,7}\\s*-\\s*\\d{4})"
        group: 1
        normalize: [ted_number]
      - type: regex
        pattern: "(?i)(?:Dzienniku\\s+Urzędowym(?:\\s+Unii\\s+Europejskiej|\\s+UE)?|Unii\\s+Europejskiej)\\s*(?:nr|:)?\\s*(\\d{4}\\s*/\\s*S\\s*\\d{1,4}\\s*-\\s*\\d{5,7}|\\d{5,7}\\s*-\\s*\\d{4})"
        group: 1
        normalize: [ted_number]
      - type: regex
        pattern: "(?i)(\\d{4}/S\\s*\\d{1,4}\\s*-\\s*\\d{5,7})"
        group: 1
        normalize: [ted_number]
      - type: regex
        pattern: "\\b(\\d{6}-\\d{4})\\b"
        group: 1
        normalize: [ted_number]

  - path: ZamowieniePubliczne.numer_postepowania
    extractors:
      - type: label
        labels:
          - "nr referencyjny sprawy"
          - "numer referencyjny sprawy"
          - "Numer postępowania"
          - "Nr postępowania"
          - "Numer referencyjny"
          - "Znak sprawy"
          - "Nr ref."
        # Uppercase/digit first char keeps prose ("jest", "brak", "sprawy") out.
        value_pattern: "([A-Z0-9][A-Za-z0-9./_\\-]{3,40})"
        normalize: [collapse_ws]
      - type: regex
        pattern: "(?i:(?:numer|nr)\\s+referencyjny(?:\\s+sprawy)?|numer\\s+postępowania|znak\\s+sprawy)\\s*[:\\-]?\\s*([A-Z0-9][A-Za-z0-9./_\\-]{3,40})"
        group: 1
        normalize: [collapse_ws]

  - path: ZamowieniePubliczne.tytul
    extractors:
      - type: regex
        # Standard filing: pn. „Title…” nr referencyjny…
        pattern: "(?i)pn\\.\\s*[„\"«]\\s*([^”\"»]{10,300})\\s*[”\"»]"
        group: 1
        normalize: [collapse_ws]
      - type: regex
        # OCR often drops the opening quote: pn. Title…", nr referencyjny
        pattern: "(?is)pn\\.\\s*([^\\n”\"»]{8,200}?(?:\\n[^\\n”\"»]{3,120}){0,3}?)\\s*[”\"»~]?,?\\s*(?:nr|numer)\\s+referencyj"
        group: 1
        normalize: [collapse_ws]
      - type: label
        labels: ["Przedmiot zamówienia", "Tytuł zamówienia", "Nazwa zamówienia"]
        value_pattern: "(.{10,300}?)"
        value_flags: "s"
        stop_at: "(?i)(\\n\\s*zarzut|\\n\\s*(?:nr|numer)\\s+referencyj|\\n\\s*I\\.|\\n\\s*1\\.)"
        normalize: [collapse_ws]

lists:
  - path: Odwolujacy
    block: odwolujacy
    mode: single
    fields:
      - key: krs
        extractors:
          # First party register row only (non-greedy) — not partner / kancelaria.
          - type: regex
            pattern: "(?is)^(?:(?!reprezentowan|adres\\s+do\\s+korespondencji).)*?\\bKRS\\b\\s*[:\\-]?\\s*(\\d{6,10})"
            group: 1
            normalize: [krs_pad10]
      - key: nip
        extractors:
          - type: regex
            pattern: "(?is)^(?:(?!reprezentowan|adres\\s+do\\s+korespondencji).)*?\\bNIP\\b\\s*[:\\-]?\\s*([\\d\\-\\s]{10,16})"
            group: 1
            normalize: [digits_only]
      - key: regon
        extractors:
          - type: regex
            # 9 or 14 digits only — do not swallow the next "2)" consortium index.
            pattern: "(?is)^(?:(?!reprezentowan|adres\\s+do\\s+korespondencji).)*?\\bREGON\\b\\s*[:\\-]?\\s*(\\d{9}|\\d{14})\\b"
            group: 1
            normalize: [digits_only]
      - key: nazwa
        extractors:
          # Consortium leader line (preferred over the "Konsorcjum wykonawców…" banner).
          - type: regex
            pattern: "(?i)Lider\\s+Konsorcjum\\s*[:\\-]?\\s*\\n\\s*([^\\n]{5,160})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            pattern: "(?i)Działając\\s+w\\s+imieniu\\s+(?:Konsorcjum\\s*[:\\-]?\\s*)?([^,\\n(]{5,120})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          # OCR: Odwołujacy: / Odwołujący: then firm on next line.
          - type: regex
            pattern: "(?i)odwo[łl]uj[aą]c\\w*\\s*:\\s*\\n\\s*([^\\n]{5,160})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            # Sole trader: "pod firmą BRONTEX-BUD Maciej Jaworski" / OCR firm line.
            pattern: "(?i)pod\\s+firmą\\s+([^,\\n(]{5,120})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            pattern: "(?i)odwo[łl]uj[aą]c\\w*\\s*[:\\-]?\\s*(?:lider\\s+konsorcjum\\s*[:\\-]?)?\\s*([^\\n]{5,200})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            # OCR sole-trader letterhead lost the "Odwołujący:" cue: "… Brzozowski Asterion Usługi Techniczne, ul."
            pattern: "([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźżì\\-]+\\s+[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\-]+\\s+[A-ZĄĆĘŁŃÓŚŹŻ][^,\\n]{5,80}?)(?=,\\s*ul\\.)"
            group: 1
            normalize: [collapse_ws, company_name]
      - key: przez-pelnomocnika
        extractors:
          - type: regex
            # petnomocnika / pehnomocnika: common OCR damage to „pełnomocnika”.
            pattern: "(?i)(reprezentowan[ya]\\s+przez|przez\\s+pe\\w{0,3}nomocnika|pe\\w{0,3}nomocnik)"
            group: 0
            const_on_match: 1
          - type: const
            value: 0
      - key: pelnomocnik.imie_nazwisko
        extractors:
          - type: regex
            # Name on the line after "przez pełnomocnika:" / "petnomocnika:"
            pattern: "(?i:przez\\s+pe\\w{0,3}nomocnika)\\s*:\\s*\\n\\s*((?:adw\\.?|r\\.?\\s*pr\\.?|radca\\s+prawny)\\s+)?([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\-]+\\s+[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\-]+)"
            group: 2
            normalize: [collapse_ws, strip_titles, person_name, nominative]
          - type: regex
            # "reprezentowana przez: r. pr. Aleksandra Marciniak, r. pr. …"
            pattern: "(?i:reprezentowan[ya]\\s+przez(?:\\s+pe\\w{0,3}nomocnika)?)\\s*[:\\-]?\\s*((?:adw\\.?|r\\.?\\s*pr\\.?|radca\\s+prawny)\\s+)?([A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 2
            normalize: [collapse_ws, strip_titles, person_name, nominative]
          - type: regex
            pattern: "(?i:pe\\w{0,3}nomocnik(?:a|iem)?)\\s*[:\\-]?\\s*((?i:adw\\.?|r\\.?\\s*pr\\.?|radca\\s+prawny)?\\s*[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 1
            normalize: [collapse_ws, strip_titles, person_name, nominative]
      - key: pelnomocnik.nazwa
        extractors:
          # Full firm on the correspondence line (may wrap before "ograniczoną…").
          - type: regex
            pattern: "(?is)adres\\s+do\\s+korespondencji\\s*[:\\-]?\\s*(.+?)(?=,\\s*(?:ul\\.|pl\\.|al\\.|os\\.)|\\sul\\.|\\n\\s*tel\\.)"
            group: 1
            normalize: [collapse_ws]
          - type: regex
            pattern: "(?i)((?:[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\-]+(?:\\s+|,\\s*)?){1,6}Kancelaria[^\\n]{3,80})"
            group: 1
            normalize: [collapse_ws]
          - type: regex
            pattern: "(?is)(Kancelaria[^\\n]{3,80}(?:\\n[^\\n]{3,60})?)"
            group: 1
            normalize: [collapse_ws]
      - key: pelnomocnik.mail
        extractors:
          - type: regex
            # Prefer attorney / kancelaria mailbox; skip mocodawca domains when possible.
            pattern: "(?i)\\b((?:kancelaria|[a-z]\\.[a-z]+|[a-z]+)\\@[A-Z0-9.\\-]*kancelaria[A-Z0-9.\\-]*\\.[A-Z]{2,})\\b"
            group: 1
            normalize: [collapse_ws]
          - type: regex
            pattern: "(?i)e-?mail\\s*[:\\-]?\\s*([A-Z0-9._%+\\-]+@[A-Z0-9.\\-]+\\.[A-Z]{2,})"
            group: 1
            normalize: [collapse_ws]
          - type: regex
            pattern: "(?i)\\b([A-Z0-9._%+\\-]+@[A-Z0-9.\\-]+\\.[A-Z]{2,})\\b"
            group: 1
            normalize: [collapse_ws]

  - path: Zamawiajacy
    block: zamawiajacy
    # Joint contracting: "1) Zamawiający – Lider… 2) Zamawiający – Partner…"
    mode: multi_from_regex
    # Require Zamawiający role, or an OCR joint list of public-body names.
    item_pattern: "(?i)(?:^|\\n)\\s*\\d+\\)\\s*(?:Zamawiaj[aą]c\\w*|Zarząd\\s+Dróg|Zakład\\s+Gospodarki|Gmina\\b|Powiat\\b|Urząd\\b|Miasto\\b|Centrum\\b|Szpital\\b|Komenda\\b|Zespół\\b)"
    fields:
      - key: krs
        extractors:
          - type: regex
            pattern: "(?i)\\bKRS\\b\\s*[:\\-]?\\s*(\\d{6,10})"
            group: 1
            normalize: [krs_pad10]
      - key: nip
        extractors:
          - type: regex
            pattern: "(?i)\\bNIP\\b\\s*[:\\-]?\\s*([\\d\\-\\s]{10,16})"
            group: 1
            normalize: [digits_only]
      - key: regon
        extractors:
          - type: regex
            pattern: "(?i)\\bREGON\\b\\s*[:\\-]?\\s*(\\d{9}|\\d{14})\\b"
            group: 1
            normalize: [digits_only]
      - key: nazwa
        extractors:
          - type: regex
            # Numbered joint member: "1) Zarząd Dróg…" / "1) Zamawiający – Lider…"
            pattern: "(?i)\\d+\\)\\s*(?:Zamawiaj[aą]c\\w*\\s*[–\\-]?\\s*(?:Lider|Partner)[^\\n]*\\n\\s*)?([A-ZĄĆĘŁŃÓŚŹŻ][^\\n]{3,160})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            # Prefer the whole line after the Zamawiający label (OCR-safe).
            pattern: "(?i)zamawiaj[aą]c\\w*\\s*:\\s*\\n\\s*([^\\n]{5,160})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            # Skip the joint-proceeding parenthetical; take the firm line.
            pattern: "(?i)(?:Zamawiaj[aą]c\\w*\\s*[–\\-]\\s*(?:Lider|Partner)[^\\n]*\\n|zamawiaj[aą]c\\w*\\s*(?:\\([^)]*\\))?\\s*[:\\-]?\\s*)\\s*([A-ZĄĆĘŁŃÓŚŹŻ][^\\n]{3,160})"
            group: 1
            normalize: [collapse_ws, strip_titles, company_name]
          - type: regex
            pattern: "([A-ZĄĆĘŁŃÓŚŹŻ][^\\n]{2,100}?(?i:S\\.A\\.|sp\\.\\s*z\\s*o\\.o\\.|sp\\.\\s*k\\.|sp\\.\\s*j\\.|Urząd\\b|Gmina\\b|Szpital|Komenda))"
            group: 1
            normalize: [collapse_ws, company_name]
      - key: prowadzacy_postepowanie
        extractors:
          # Only joint-contracting role labels — not "Lider Konsorcjum" from Odwołujący.
          - type: regex
            pattern: "(?i)Zamawiaj[aą]c\\w*\\s*[–\\-]\\s*Lider|Lider\\s+postępowania|prowadząc[ya]\\s+postępowanie"
            group: 0
            const_on_match: 1
          - type: regex
            pattern: "(?i)Zamawiaj[aą]c\\w*\\s*[–\\-]\\s*Partner|\\bPartner\\s+postępowania\\b"
            group: 0
            const_on_match: 0
          - type: const
            value: null
