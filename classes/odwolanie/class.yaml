id: odwolanie
label: Odwołanie do KIO
detect:
  threshold: 7.0
  margin: 1.5
  keywords:
    # Letter-spaced title "O D W O Ł A N I E" counts as a filing heading.
    - { pattern: "(?i)\\bO\\s*D\\s*W\\s*O\\s*[ŁL]\\s*A\\s*N\\s*I\\s*E\\b", weight: 5.0 }
    - { pattern: "(?i)\\bodwołanie\\b", weight: 4.0 }
    - { pattern: "(?i)Prezes\\s+Krajowej\\s+Izby\\s+Odwoławczej", weight: 5.0 }
    - { pattern: "(?i)Krajow[ae]\\s+Izb[ay]\\s+Odwoławcz", weight: 4.0 }
    - { pattern: "(?i)\\bKIO\\b", weight: 1.5 }
    - { pattern: "(?i)\\bodwołując", weight: 3.0 }
    - { pattern: "(?i)\\bzamawiając", weight: 1.5 }
    - { pattern: "(?i)\\bzarzut", weight: 2.0 }
    - { pattern: "(?i)zaskarżon", weight: 2.0 }
    - { pattern: "(?i)wnoszę\\s+odwołanie|wnosi\\s+odwołanie", weight: 3.5 }
    - { pattern: "(?i)wnoszę\\s+o\\s*:|Działając\\s+w\\s+imieniu", weight: 2.0 }
    - { pattern: "(?i)art\\.\\s*513|Prawo\\s+zamówień\\s+publicznych", weight: 1.5 }

blocks:
  - id: header
    start: null
    end: "(?i)odwołując"
  - id: odwolujacy
    start: "(?i)odwołując"
    end: "(?i)zamawiając"
  - id: zamawiajacy
    start: "(?i)zamawiając"
    end: "(?i)(dotycząc[ae]\\s+postępowania|zamówieni[ae]\\s+publiczn|przedmiot|zarzut)"
  - id: zarzuty
    start: "(?i)zarzut"
    end: null

fields:
  - path: OdwolanieKIO.data
    extractors:
      # "Bydgoszcz, dnia 2 marca 2026 roku" (header or mid-letter).
      - type: regex
        pattern: "(?i)(?:^|\\n)\\s*[A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40}\\s*,\\s*dnia\\s+(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        block: header
        pattern: "(?i)dnia\\s+(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        block: header
        pattern: "(?i)(\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})\\s*r?\\.?"
        group: 1
        normalize: [date_pl]

  - path: OdwolanieKIO.miejscowosc
    extractors:
      # Case-sensitive on purpose: [A-Z…] must mean an uppercase initial, so
      # only keywords are wrapped in a scoped (?i:…) flag.
      - type: regex
        pattern: "(?:^|\\n)\\s*([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{1,40})\\s*,\\s*(?i:dnia)\\s+"
        group: 1
        normalize: [collapse_ws, strip_titles]
      - type: regex
        block: header
        pattern: "^\\s*([A-ZĄĆĘŁŃÓŚŹŻ][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż\\- ]{2,40})\\s*,\\s*(?i:dnia)"
        group: 1
        normalize: [collapse_ws, strip_titles]

  - path: OdwolanieKIO.czynnosc_dzien
    extractors:
      # Prefer "w dniu …" next to the challenged act (not "ustawy z dnia 11 września 2019").
      - type: regex
        pattern: "(?i)w\\s+dniu\\s+(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        pattern: "(?i)(?:unieważni\\w*|odrzuci\\w*|wykluczy\\w*|udostępni\\w*)[^\\n]{0,40}?(\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4}|\\d{1,2}[./-]\\d{1,2}[./-]\\d{4})"
        group: 1
        normalize: [date_pl]
      - type: regex
        block: zarzuty
        pattern: "(?i)(?:z\\s+dnia|dnia)\\s+(\\d{1,2}[./-]\\d{1,2}[./-]\\d{4}|\\d{1,2}\\s+[A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]+\\s+\\d{4})"
        group: 1
        normalize: [date_pl]

  - path: OdwolanieKIO.czynnosc_powod_id
    extractors:
      # Intro sentence before the zarzuty list carries the challenged act.
      - type: regex
        pattern: "(?i)((?:Zamawiający|w\\s+dniu).{0,200}?(?:unieważni\\w*|odrzuc\\w*|wyklucz\\w*|wybra\\w*|udostępni\\w*|zaniecha\\w*|modyfikacj\\w*|poinformowa\\w*).{0,100})"
        group: 1
        normalize: [collapse_ws]
        map_to_powod_id: true
      - type: regex
        block: zarzuty
        pattern: "(?i)(zaniechanie\\s+unieważnienia\\s+postępowania|decyzj[aei]\\s+o\\s+unieważnieniu\\s+postępowania|unieważni\\w*\\s+postępowani|zaniechanie\\s+wykluczenia\\s+wykonawcy|zaniechanie\\s+odrzucenia\\s+oferty|odpowiedzi/?wyjaśnienia\\s+do\\s+SWZ|wyjaśnieni[ae]\\s+do\\s+SWZ|modyfikacj[aei]\\s+treści\\s+SWZ|publikacj[aei]\\s+specyfikacji\\s+warunków\\s+zamówienia|specyfikacj[aei]\\s+warunków\\s+zamówienia\\s*\\(?SWZ\\)?|projektowane\\s+postanowienia\\s+umowy|ogłoszeni[ae]\\s+wyboru\\s+oferty|decyzj[aei]\\s+o\\s+wykluczeniu\\s+wykonawcy|decyzj[aei]\\s+o\\s+odrzuceniu\\s+oferty|odrzuc\\w*\\s+ofert|wyklucz\\w*\\s+wykonawc|opis\\s+przedmiotu\\s+zamówienia)"
        group: 1
        normalize: [collapse_ws]
        map_to_powod_id: true

  - path: OdwolanieKIO.czynnosc_opis
    extractors:
      - type: derived
        from: OdwolanieKIO.czynnosc_powod_id
        via: czynnosc_powod_opis

  - path: ZamowieniePubliczne.numer_bzp
    extractors:
      - type: regex
        pattern: "(?i)(?:BZP|Biuletyn(?:ie)?\\s+Zamówień\\s+Publicznych)[^\\d]{0,40}(\\d{4}\\s*/\\s*BZP\\s*\\d{5,12}(?:\\s*/\\s*\\d{1,3})?)"
        group: 1
        normalize: [bzp_number]
      - type: regex
        pattern: "(\\d{4}/BZP\\s*\\d{5,12}(?:/\\d{1,3})?)"
        group: 1
        normalize: [bzp_number]

  - path: ZamowieniePubliczne.numer_ted
    extractors:
      - type: regex
        pattern: "(?i)(?:TED|nr\\s*TED|numer\\s*TED)[^\\d]{0,20}(\\d{5,7}\\s*-\\s*\\d{4})"
        group: 1
        normalize: [ted_number]
      - type: regex
        pattern: "(?i)(\\d{4}/S\\s*\\d{1,4}\\s*-\\s*\\d{5,7})"
        group: 1
        normalize: [ted_number]
      - type: regex
        pattern: "\\b(\\d{6}-\\d{4})\\b"
        group: 1
        normalize: [ted_number]

  - path: ZamowieniePubliczne.numer_postepowania
    extractors:
      - type: label
        labels:
          - "nr referencyjny sprawy"
          - "numer referencyjny sprawy"
          - "Numer postępowania"
          - "Nr postępowania"
          - "Numer referencyjny"
          - "Znak sprawy"
          - "Nr ref."
        # Uppercase/digit first char keeps prose ("jest", "brak", "sprawy") out.
        value_pattern: "([A-Z0-9][A-Za-z0-9./_\\-]{3,40})"
        normalize: [collapse_ws]
      - type: regex
        pattern: "(?i:(?:numer|nr)\\s+referencyjny(?:\\s+sprawy)?|numer\\s+postępowania|znak\\s+sprawy)\\s*[:\\-]?\\s*([A-Z0-9][A-Za-z0-9./_\\-]{3,40})"
        group: 1
        normalize: [collapse_ws]

  - path: ZamowieniePubliczne.tytul
    extractors:
      - type: regex
        # Standard filing: pn. „Title…” nr referencyjny…
        pattern: "(?i)pn\\.\\s*[„\"«]\\s*([^”\"»]{10,300})\\s*[”\"»]"
        group: 1
        normalize: [collapse_ws]
      - type: label
        labels: ["Przedmiot zamówienia", "Tytuł zamówienia", "Nazwa zamówienia"]
        value_pattern: "(.{10,300}?)"
        value_flags: "s"
        stop_at: "(?i)(\\n\\s*zarzut|\\n\\s*(?:nr|numer)\\s+referencyj|\\n\\s*I\\.|\\n\\s*1\\.)"
        normalize: [collapse_ws]

lists:
  - path: Odwolujacy
    block: odwolujacy
    mode: single
    fields:
      - key: krs
        extractors:
          - type: regex
            pattern: "(?i)\\bKRS\\b\\s*[:\\-]?\\s*(\\d{6,10})"
            group: 1
            normalize: [krs_pad10]
      - key: nip
        extractors:
          - type: regex
            pattern: "(?i)\\bNIP\\b\\s*[:\\-]?\\s*([\\d\\-\\s]{10,16})"
            group: 1
            normalize: [digits_only]
      - key: regon
        extractors:
          - type: regex
            pattern: "(?i)\\bREGON\\b\\s*[:\\-]?\\s*([\\d\\s]{7,16})"
            group: 1
            normalize: [digits_only]
      - key: nazwa
        extractors:
          - type: regex
            pattern: "(?i)odwołując[ya]\\s*[:\\-]?\\s*(?:lider\\s+konsorcjum\\s*[:\\-]?)?\\s*([^\\n]{5,200})"
            group: 1
            normalize: [collapse_ws, strip_titles]
      - key: przez-pelnomocnika
        extractors:
          - type: regex
            pattern: "(?i)(reprezentowan[ya]\\s+przez|przez\\s+pełnomocnika|pełnomocnik)"
            group: 0
            const_on_match: 1
          - type: const
            value: 0
      - key: pelnomocnik.imie_nazwisko
        extractors:
          - type: regex
            # "reprezentowana przez: r. pr. Aleksandra Marciniak, r. pr. …"
            pattern: "(?i:reprezentowan[ya]\\s+przez)\\s*[:\\-]?\\s*((?:adw\\.?|r\\.?\\s*pr\\.?|radca\\s+prawny)\\s+)?([A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 2
            normalize: [collapse_ws, strip_titles, nominative]
          - type: regex
            pattern: "(?i:pełnomocnik(?:a|iem)?)\\s*[:\\-]?\\s*((?i:adw\\.?|r\\.?\\s*pr\\.?|radca\\s+prawny)?\\s*[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)\\s+[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+)(?:-[A-ZĄĆĘŁŃÓŚŹŻ](?:[a-ząćęłńóśźż]+|[A-ZĄĆĘŁŃÓŚŹŻ]+))?)"
            group: 1
            normalize: [collapse_ws, strip_titles, nominative]
      - key: pelnomocnik.nazwa
        extractors:
          - type: regex
            pattern: "(?i)adres\\s+do\\s+korespondencji\\s*[:\\-]?\\s*(Kancelaria[\\s\\S]{3,160}?)(?=,\\s*ul\\.|\\nul\\.|\\n\\s*tel\\.)"
            group: 1
            normalize: [collapse_ws]
          - type: regex
            pattern: "(?i)(Kancelaria[^\\n]{3,120})"
            group: 1
            normalize: [collapse_ws]
      - key: pelnomocnik.mail
        extractors:
          - type: regex
            pattern: "(?i)\\b([A-Z0-9._%+\\-]+@[A-Z0-9.\\-]+\\.[A-Z]{2,})\\b"
            group: 1
            normalize: [collapse_ws]

  - path: Zamawiajacy
    block: zamawiajacy
    mode: single
    fields:
      - key: krs
        extractors:
          - type: regex
            pattern: "(?i)\\bKRS\\b\\s*[:\\-]?\\s*(\\d{6,10})"
            group: 1
            normalize: [krs_pad10]
      - key: nip
        extractors:
          - type: regex
            pattern: "(?i)\\bNIP\\b\\s*[:\\-]?\\s*([\\d\\-\\s]{10,16})"
            group: 1
            normalize: [digits_only]
      - key: regon
        extractors:
          - type: regex
            pattern: "(?i)\\bREGON\\b\\s*[:\\-]?\\s*([\\d\\s]{7,16})"
            group: 1
            normalize: [digits_only]
      - key: nazwa
        extractors:
          - type: regex
            pattern: "(?i)zamawiając[ya]\\s*[:\\-]?\\s*([^\\n]{5,200})"
            group: 1
            normalize: [collapse_ws, strip_titles]
      - key: prowadzacy_postepowanie
        extractors:
          - type: regex
            pattern: "(?i)(prowadząc[ya]\\s+postępowanie|lider\\s+postępowania)"
            group: 0
            const_on_match: 1
          - type: const
            value: null
