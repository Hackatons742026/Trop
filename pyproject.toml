[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trop"
version = "0.1.0"
description = "TROP — HackNation Odwołania2json: PDF → structured JSON for appeal cases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pypdfium2==5.15.2",
    "rapidocr==3.10.0",
    "onnxruntime==1.23.2",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "typer==0.20.0",
    "rich==14.2.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.3",
    "python-stdnum==2.1",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "jsonschema==4.25.1",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "opencv-python-headless==4.12.0.88",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.7",
    "reportlab==4.4.4",
]

[project.scripts]
trop = "trop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP045"]  # Typer Option[] still works best with Optional[]
